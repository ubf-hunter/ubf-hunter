name: "Génère l'animation du graphe de contributions"

on:
  schedule:
    - cron: "0 3 * * *" # tous les jours à 3h UTC
  workflow_dispatch: # déclenchement manuel possible depuis l'onglet Actions
  push:
    branches:
      - main

jobs:
  generer-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Génère le SVG animé (thème Nova, bleu -> violet)"
        uses: Platane/snk@v3
        with:
          github_user_name: ubf-hunter
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#7B2FF7
            dist/snake-dark.svg?palette=github-dark&color_snake=#7B2FF7

      - name: "Publie le resultat sur la branche output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
