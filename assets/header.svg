<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050510" />
      <stop offset="100%" stop-color="#0B0B22" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#FF2E9A" />
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="6s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#FF2E9A" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00F0FF" stroke-width="0.5" opacity="0.35" />
    </pattern>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="900" height="240" fill="url(#bg)" />
  <rect width="900" height="240" fill="url(#grid)">
    <animate attributeName="opacity" values="0.25;0.55;0.25" dur="4s" repeatCount="indefinite" />
  </rect>

  <!-- balayage lumineux -->
  <rect x="0" y="-120" width="900" height="120" fill="url(#scan)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 360; 0 0" dur="7s" repeatCount="indefinite" />
  </rect>

  <!-- noeuds de circuit, lumieres qui respirent -->
  <circle cx="60" cy="40" r="3" fill="#00F0FF"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0s" repeatCount="indefinite" /></circle>
  <circle cx="840" cy="60" r="3" fill="#FF2E9A"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" begin="0.6s" repeatCount="indefinite" /></circle>
  <circle cx="120" cy="200" r="3" fill="#9D4EDD"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" begin="1.1s" repeatCount="indefinite" /></circle>
  <circle cx="780" cy="190" r="3" fill="#00F0FF"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" begin="0.3s" repeatCount="indefinite" /></circle>
  <circle cx="450" cy="30" r="3" fill="#FF2E9A"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="0.9s" repeatCount="indefinite" /></circle>

  <!-- cadre neon -->
  <rect x="4" y="4" width="892" height="232" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.8" filter="url(#glow)" />

  <!-- titre -->
  <text x="450" y="118" font-family="Consolas, 'Fira Code', monospace" font-size="58" font-weight="700"
        text-anchor="middle" fill="url(#textGrad)" filter="url(#glow)" letter-spacing="6">
    UBF HUNTER
  </text>

  <!-- sous-titre -->
  <text x="450" y="160" font-family="Consolas, monospace" font-size="18" text-anchor="middle" fill="#B8B8FF" letter-spacing="2">
    DÉVELOPPEUR FULL-STACK · FONDATEUR @ NOVA · YAOUNDÉ
  </text>

  <!-- curseur clignotant -->
  <rect x="620" y="148" width="12" height="20" fill="#00F0FF">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>
</svg>
